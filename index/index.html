<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SEKHARI Guillaume - Électricien</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap');

        body {
            margin: 0;
            padding: 0;
            min-height: 100vh;
            background-color: #05080a;
            font-family: 'Inter', sans-serif;
            color: #a0abb6;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
        }

        .background-wave {
            position: absolute;
            width: 150vw;
            height: 2px;
            background: linear-gradient(90deg, transparent 10%, rgba(255, 50, 50, 0.8) 40%, rgba(50, 100, 255, 0.9) 60%, transparent 90%);
            box-shadow: 0 0 50px 20px rgba(50, 100, 255, 0.2), 0 0 20px 5px rgba(255, 50, 50, 0.3);
            transform: rotate(-12deg);
            z-index: 0;
        }

        .mesh-overlay {
            position: absolute;
            inset: 0;
            background-image: radial-gradient(rgba(255, 255, 255, 0.05) 1px, transparent 1px);
            background-size: 4px 4px;
            z-index: 1;
            opacity: 0.3;
        }

        .glass-card {
            position: relative;
            z-index: 10;
            width: 320px;
            background: rgba(18, 22, 28, 0.6);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(50, 100, 255, 0.3); 
            border-left: 2px solid rgba(255, 50, 50, 0.6); 
            border-radius: 12px;
            padding: 45px 0 20px 0; 
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.8), inset 0 0 15px rgba(50, 100, 255, 0.05);
            margin-top: 40px;
        }

        .profile-pic {
            position: absolute;
            top: -40px;
            left: 50%;
            transform: translateX(-50%);
            width: 75px;
            height: 75px;
            border-radius: 50%;
            border: 2px solid rgba(50, 100, 255, 0.8);
            box-shadow: 0 0 15px rgba(255, 50, 50, 0.4);
            overflow: hidden;
            background-color: #1a1a1a;
        }

        .profile-pic img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .card-header {
            padding: 0 20px 15px 20px;
        }

        .card-header h1 {
            margin: 0;
            font-size: 1.15rem;
            color: #ffffff;
            font-weight: 600;
            letter-spacing: 0.5px;
        }

        .card-header p {
            margin: 5px 0 0 0;
            font-size: 0.8rem;
            color: rgba(255, 80, 80, 0.9); 
        }

        .section-title {
            font-size: 0.65rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: rgba(255, 255, 255, 0.4);
            margin: 15px 20px 5px 20px;
        }

        .menu-list {
            list-style: none;
            padding: 0;
            margin: 0;
        }

        .menu-list li {
            padding: 8px 20px;
            font-size: 0.85rem;
            display: flex;
            align-items: center;
            gap: 12px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .menu-list li:hover {
            background: rgba(255, 255, 255, 0.05);
            color: #ffffff;
            text-shadow: 0 0 8px rgba(255, 255, 255, 0.3);
        }

        .icon {
            font-size: 1.1rem;
            opacity: 0.8;
            width: 20px;
            text-align: center;
        }

        .divider {
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.1), transparent);
            margin: 10px 0;
        }

        a {
            color: inherit;
            text-decoration: none;
        }

        .cta-container {
            padding: 15px 20px 0 20px;
        }

        .cta-button {
            display: block;
            width: 100%;
            padding: 10px 0;
            text-align: center;
            background: rgba(50, 100, 255, 0.1);
            border: 1px solid rgba(50, 100, 255, 0.4);
            color: #ffffff;
            font-size: 0.9rem;
            font-weight: 500;
            border-radius: 8px;
            transition: all 0.3s ease;
            box-sizing: border-box;
        }

        .cta-button:hover {
            background: rgba(50, 100, 255, 0.25);
            border-color: rgba(255, 50, 50, 0.6);
            box-shadow: 0 0 15px rgba(255, 50, 50, 0.2);
        }
    </style>
</head>
<body>

    <div class="background-wave"></div>

    <div class="glass-card">
        
        <div class="profile-pic">

        <div class="card-header">

            <a href="mailto:inguisek@gmail.com">
                <li>
                    <span class="icon">✉️</span>

        <div class="section-title">Services</div>
        <ul class="menu-list">

            </li>

            </li>
        </ul>

        <div class="cta-container">
            <a href="mailto:inguisek@gmail.com" class="cta-button">Demander un devis</a>
        </div>

    </div>

</body>
</html>
